<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>عارض سجلات الحضور</title>

<!-- SheetJS لقراءة Excel محليًا -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#0f172a; --card:#0b1220; --accent:#06b6d4; --muted:#94a3b8; --glass:rgba(255,255,255,0.03);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:"Segoe UI", Tahoma, Arial;background:linear-gradient(180deg,#021028 0%, #031a2b 60%);color:#e6eef6}
.container{max-width:1200px;margin:24px auto;padding:18px}
.header{display:flex;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#8b5cf6);display:flex;align-items:center;justify-content:center;font-weight:700;color:#021;box-shadow:0 6px 18px rgba(6,182,212,.12)}
.hgroup h1{margin:0;font-size:18px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.input-file{background:var(--glass);border:1px solid rgba(255,255,255,0.06);padding:8px 10px;border-radius:10px;cursor:pointer}
.select-month{padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit}
.btn{background:linear-gradient(90deg,var(--accent),#8b5cf6);border:none;padding:9px 12px;border-radius:8px;color:#012;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted)}
.meta{margin-top:12px;color:var(--muted);font-size:13px}
.reports{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-top:14px}
.card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.03);padding:10px;border-radius:10px;box-shadow:0 6px 20px rgba(2,6,23,0.6)}
.table-wrap{overflow:auto;max-height:480px}
table{width:100%;border-collapse:collapse;font-size:13px;color:#dbeafe}
th,td{padding:6px 8px;text-align:center;border:1px solid rgba(255,255,255,0.03)}
th{position:sticky;top:0;background:rgba(0,0,0,0.15);backdrop-filter:blur(6px)}
.empty{padding:22px;border:2px dashed rgba(255,255,255,0.03);border-radius:10px;text-align:center;color:var(--muted)}
.footer{margin-top:18px;color:var(--muted);font-size:13px;text-align:center}

/* ===== طباعة مخصصة ===== */
@media print{
  body, .container { background:#fff; color:#000; }
  .controls, .footer, .btn, .input-file, .select-month { display:none !important; }
}

/* تحسينات الطباعة */
@media print {
  body {
    font-family: 'Arial', sans-serif;
    font-size: 11px; /* تصغير حجم الخط ليتسع في صفحة واحدة */
    line-height: 1.3;
    margin: 0;
    padding: 8px;
  }
  
  /* تحسين الهيدر للطباعة */
  .company-header {
    text-align: center;
    margin-bottom: 15px;
    padding-bottom: 8px;
    border-bottom: 1px solid #333;
    page-break-inside: avoid;
  }
  
  .company-header h1 {
    margin: 0 0 3px 0;
    font-size: 18px;
    color: #000;
  }
  
  .company-header .subtitle {
    font-size: 13px;
    color: #666;
    margin-bottom: 5px;
  }
  
  /* صفحة كشف الأسماء */
  .print-first-page {
    page-break-after: always;
  }
  
  /* بطاقة بيانات الموظف العلوية - أكثر إحكاما */
  .employee-card {
    background: #f8f9fa;
    border: 1px solid #ddd;
    border-radius: 3px;
    padding: 8px;
    margin-bottom: 10px;
    page-break-inside: avoid;
  }
  
  .employee-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid #ccc;
  }
  
  .employee-info {
    flex: 1;
  }
  
  .employee-name {
    font-size: 14px;
    font-weight: bold;
    margin: 0 0 3px 0;
    color: #000;
  }
  
  .employee-id {
    font-size: 11px;
    color: #555;
    margin: 0;
  }
  
  .employee-meta {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 6px;
  }
  
  .meta-item {
    background: white;
    border: 1px solid #eee;
    padding: 6px;
    border-radius: 2px;
    text-align: center;
  }
  
  .meta-label {
    font-size: 9px;
    color: #666;
    margin-bottom: 2px;
  }
  
  .meta-value {
    font-size: 10px;
    font-weight: bold;
    color: #333;
  }
  
  /* جدول الحضور - أصغر حجما */
  .attendance-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
    font-size: 9px;
  }
  
  .attendance-table th,
  .attendance-table td {
    border: 1px solid #333;
    padding: 3px 4px;
    text-align: center;
  }
  
  .attendance-table thead th {
    background-color: #e9ecef;
    font-weight: bold;
    color: #212529;
    font-size: 9px;
    padding: 4px 5px;
  }
  
  .attendance-table tbody tr:nth-child(even) {
    background-color: #f9f9f9;
  }
  
  /* جعل صفحة الموظف في صفحة واحدة */
  .employee-section {
    page-break-inside: avoid;
    page-break-after: always;
    margin-top: 15px;
    padding-top: 15px;
  }
  
  /* تقليل المسافات بين الصفوف */
  .attendance-table tr {
    height: 22px;
  }
  
  /* معلومات الصفحة */
  .page-info {
    font-size: 9px;
    color: #666;
    text-align: left;
    margin-top: 5px;
    border-top: 1px solid #ddd;
    padding-top: 4px;
  }
  
  /* تحسين استهلاك المساحة */
  @page {
    margin: 10mm; /* تقليل الهوامش */
    size: A4;
  }
  
  /* إخفاء عناصر الطباعة غير المرغوبة */
  @media print {
    .no-print {
      display: none !important;
    }
  }
}

/* تنسيقات الشاشة */
.small{font-size:12px;color:var(--muted)}

/* تحسينات الهيدر */
.header {
  background: linear-gradient(90deg, rgba(11, 18, 32, 0.8), rgba(6, 182, 212, 0.1));
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.05);

  padding: 15px 20px;

  box-shadow: 0 8px 32px rgba(2, 6, 23, 0.3);
}

  flex: 1;
}

.hgroup h1 {
  font-size: 20px;
  background: linear-gradient(90deg, #06b6d4, #8b5cf6);
  -webkit-background-clip: text;

}

.header .small {

.logo:hover {

/* تحسين الأزرار */
.btn {
  transition: all 0.3s ease;
  position: relative;

}

.btn::after {
  content: '';
  position: absolute;
  top: 50%;

  height: 0;

}

.btn:hover {

}

.btn.ghost:hover {

/* تحسين عناصر التحكم */
.controls {
  background: rgba(11, 18, 32, 0.5);
  border-radius: 12px;
  padding: 15px;
  border: 1px solid rgba(255, 255, 255, 0.03);

}

.input-file {

.input-file:hover {

<body>
<div class="container">
  <div class="header">
    <div class="brand">
      <div class="logo">س</div>
      <div class="hgroup">
        <h1>عارض سجلات الحضور لريان الجوار</h1>
        <div class="small">النسخة النهائية - قراءة Excel محليًا</div>
      </div>
    </div>
    <div class="small">سعيد منصور</div>
  </div>

  <div class="controls">
    <label class="input-file" onclick="document.getElementById('fileInput').click()">📁 اختر ملف Excel
      <input id="fileInput" type="file" accept=".xls,.xlsx" style="display:none" onchange="handleExcelFile(event)">
    </label>

    <button class="btn ghost" onclick="downloadDisplayedCSV()">📥 تحميل CSV</button>
    <button class="btn" onclick="printAllEmployeesStyled()">🖨️ طباعة الكشف + صفحات الموظفين</button>
    <button class="btn ghost" onclick="showAllDatesTable()">📅 عرض جميع التواريخ</button>
  </div>

  <div id="metaInfo" class="meta">لم يتم رفع ملف بعد.</div>
  
  <div id="allDatesTable" style="display:none; margin-bottom:20px;">
    <h3 style="text-align:center; margin-bottom:10px;">جميع التواريخ في الملف</h3>
    <div id="datesTableContent"></div>
  </div>

  <div id="reports" class="reports">
    <div class="empty">لم يتم تحميل بيانات بعد.</div>
  </div>

  <div class="footer">تطبيق محلي — لا حاجة لسيرفر | النسخة النهائية</div>
</div>

<script>
/* حالة التطبيق */
const state = {
  raw: [],
  grouped: {},   // grouped[id][date] = [times...]
  months: new Set(),
  names: {},
  allDates: new Set(),
  dateDayMap: {} // حفظ تخطيط التاريخ-اليوم
};

/* قراءة ملف Excel */
function handleExcelFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const data = new Uint8Array(ev.target.result);
    const wb = XLSX.read(data, { type: 'array' });
    const sheetName = wb.SheetNames[0];
    const ws = wb.Sheets[sheetName];
    const json = XLSX.utils.sheet_to_json(ws, { header: 1 });
    processExcelData(json);
  };
  reader.readAsArrayBuffer(file);
}

/* فك تشفير الأسماء */
function decodePossiblyCP1256(text){
  if(!text) return '';
  text = String(text);
  if(/[\u0600-\u06FF]/.test(text)) return text;
  try{
    if(typeof TextDecoder === 'function'){
      const decoder = new TextDecoder('windows-1256');
      const bytes = new Uint8Array(text.split('').map(ch => ch.charCodeAt(0) & 0xFF));
      const dec = decoder.decode(bytes);
      if(/[ء-ي]/.test(dec)) return dec;
    }
  }catch(e){}
  try{
    const conv = decodeURIComponent(escape(text));
    if(/[ء-ي]/.test(conv)) return conv;
  }catch(e){}
  return text;
}

/* تحويل Excel serial date إلى YYYY-MM-DD */
function excelSerialToDate(serial){
  const n = Number(serial);
  if(isNaN(n)) return serial;
  const epoch = new Date(Date.UTC(1899,11,30));
  epoch.setUTCDate(epoch.getUTCDate() + n);
  const y = epoch.getUTCFullYear();
  const m = String(epoch.getUTCMonth()+1).padStart(2,'0');
  const d = String(epoch.getUTCDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

/* تحويل التاريخ إلى صيغة dd/mm/yyyy للعرض */
function formatDateDMY(dateStr) {
  if (!dateStr) return '';
  
  // إذا كان التاريخ بصيغة mm/dd/yyyy
  if (dateStr.includes('/')) {
    const parts = dateStr.split('/');
    if (parts.length === 3) {
      const month = parts[0].padStart(2, '0');
      const day = parts[1].padStart(2, '0');
      let year = parts[2];
      if (year.length === 2) year = '20' + year;
      return `${day}/${month}/${year}`;
    }
  }
  
  // إذا كان التاريخ بصيغة yyyy-mm-dd
  if (dateStr.includes('-')) {
    const parts = dateStr.split('-');
    if (parts.length === 3) {
      const day = parts[2].padStart(2, '0');
      const month = parts[1].padStart(2, '0');
      const year = parts[0];
      return `${day}/${month}/${year}`;
    }
  }
  
  return dateStr;
}

/* تحويل التاريخ من mm/dd/yyyy إلى Date object */
function parseMDYToDate(dateStr) {
  if (!dateStr) return null;
  
  dateStr = dateStr.toString().trim();
  
  if (dateStr.includes('/')) {
    const parts = dateStr.split('/');
    if (parts.length === 3) {
      const month = parseInt(parts[0], 10) - 1;
      const day = parseInt(parts[1], 10);
      let year = parseInt(parts[2], 10);
      
      if (year < 100) {
        year += 2000;
      }
      
      return new Date(year, month, day, 12, 0, 0);
    }
  }
  
  return null;
}

/* تحويل تاريخ إلى اسم يوم عربي بشكل صحيح */
function getArabicWeekday(dateStr){
  if(!dateStr || dateStr.trim() === '') return '';
  
  // إذا كان لدينا اليوم محفوظاً مسبقاً
  if (state.dateDayMap[dateStr]) {
    return state.dateDayMap[dateStr];
  }
  
  if (!dateStr.match(/\d{1,2}\/\d{1,2}\/\d{2,4}/)) {
    return '';
  }
  
  const dateObj = parseMDYToDate(dateStr);
  
  if (!dateObj || isNaN(dateObj.getTime())) {
    return '';
  }
  
  const days = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  const dayIndex = dateObj.getDay();
  const dayName = days[dayIndex];
  
  // حفظ اليوم للتاريخ
  state.dateDayMap[dateStr] = dayName;
  
  return dayName;
}

/* اختبار أن اليوم يتطابق مع التاريخ */
function testAllDates() {
  console.log('=== اختبار جميع التواريخ ===');
  const allDates = Array.from(state.allDates).sort();
  
  allDates.forEach(date => {
    const day = getArabicWeekday(date);
    const dateObj = parseMDYToDate(date);
    console.log(`${formatDateDMY(date)} (${date}) => ${day}`);
  });
  
  // التحقق من الجمعة
  const fridayDates = allDates.filter(date => getArabicWeekday(date) === 'الجمعة');
  console.log(`عدد أيام الجمعة: ${fridayDates.length}`);
  fridayDates.forEach(date => {
    console.log(`يوم الجمعة: ${formatDateDMY(date)} (${date})`);
  });
}

/* تنظيف وتنسيق الوقت */
function cleanAndFormatTime(timeStr) {
  if (!timeStr) return '';
  
  let cleaned = String(timeStr).trim();
  if (!cleaned) return '';

  // تحويل الأحرف الغريبة إلى AM/PM
  if (cleaned.includes('ã') || cleaned.includes('Ã')) {
    cleaned = cleaned.replace(/[ãÃ]/g, 'PM');
  }
  
  if (cleaned.includes('Õ') || cleaned.includes('õ')) {
    cleaned = cleaned.replace(/[Õõ]/g, 'AM');
  }

  cleaned = cleaned.replace(/[^0-9:.\sAPMapm]/g, '').trim();
  
  if (cleaned.match(/[APap][Mm]/)) {
    const timeParts = cleaned.split(/:|\s/);
    let hours = parseInt(timeParts[0]);
    const minutes = timeParts[1] || '00';
    const period = cleaned.toUpperCase().includes('PM') ? 'PM' : 'AM';
    
    if (period === 'PM' && hours < 12) {
      hours += 12;
    } else if (period === 'AM' && hours === 12) {
      hours = 0;
    }
    
    return `${String(hours).padStart(2, '0')}:${minutes.padStart(2, '0')}`;
  }
  
  if (cleaned.match(/^\d{1,2}:\d{2}$/)) {
    const [h, m] = cleaned.split(':');
    return `${String(h).padStart(2, '0')}:${m.padStart(2, '0')}`;
  }
  
  if (cleaned.match(/^\d+\.\d+$/)) {
    const decimal = parseFloat(cleaned);
    const totalMinutes = Math.round(decimal * 24 * 60);
    const hours = Math.floor(totalMinutes / 60);
    const minutes = totalMinutes % 60;
    return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
  }
  
  return cleaned;
}

/* معالجة بيانات الإكسل */
function processExcelData(data){
  state.raw = data;
  state.grouped = {};
  state.months = new Set();
  state.names = {};
  state.allDates = new Set();
  state.dateDayMap = {};

  for(let i=1;i<data.length;i++){
    const row = data[i];
    if(!row || row.length < 4) continue;

    const rawName = typeof row[1] !== 'undefined' ? row[1] : '';
    const name = decodePossiblyCP1256(rawName).trim();
    const id = row[2] !== undefined ? String(row[2]).trim() : '';
    let dateTime = row[3] !== undefined ? String(row[3]).trim() : '';
    if(!id || !dateTime) continue;

    let datePart = '';
    let timePart = '';

    if(/^\d+(\.\d+)?$/.test(dateTime) && dateTime.length < 6){
      datePart = excelSerialToDate(dateTime.split('.')[0]);
    } else {
      const parts = dateTime.split(' ');
      if(parts.length >= 1){
        datePart = parts[0];
        timePart = parts.slice(1).join(' ');
      }
      
      if(datePart.indexOf('/') !== -1){
        const dp = datePart.split('/');
        if(dp.length === 3){
          let month = dp[0].padStart(2,'0');
          let day = dp[1].padStart(2,'0');
          let year = dp[2];
          if(year.length === 2) year = '20' + year;
          datePart = `${month}/${day}/${year}`;
        }
      } else if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(datePart)){
        const parts = datePart.split('-');
        datePart = `${parts[1]}/${parts[2]}/${parts[0]}`;
      } else {
        const n = Number(datePart);
        if(!isNaN(n)) {
          const serialDate = excelSerialToDate(n);
          const parts = serialDate.split('-');
          datePart = `${parts[1]}/${parts[2]}/${parts[0]}`;
        }
      }
    }

    timePart = cleanAndFormatTime(timePart);

    if(name && !state.names[id]) state.names[id] = name;

    if(!state.grouped[id]) state.grouped[id] = {};
    if(!state.grouped[id][datePart]) state.grouped[id][datePart] = [];
    if(timePart && !state.grouped[id][datePart].includes(timePart)) state.grouped[id][datePart].push(timePart);

    if(datePart && datePart.length >= 8) {
      state.allDates.add(datePart);
      const parts = datePart.split('/');
      if(parts.length === 3) {
        const monthYear = `${parts[2]}-${parts[0]}`;
        state.months.add(monthYear);
      }
    }
  }

  for(const id of Object.keys(state.grouped)){
    for(const d of Object.keys(state.grouped[id])){
      state.grouped[id][d].sort();
    }
  }

  const sortedDates = Array.from(state.allDates).sort((a, b) => {
    const dateA = parseMDYToDate(a);
    const dateB = parseMDYToDate(b);
    return dateA - dateB;
  });
  state.allDates = new Set(sortedDates);

  testAllDates();

  const totalRecords = Math.max(0, state.raw.length - 1);
  const totalEmployees = Object.keys(state.grouped).length;
  const totalDays = state.allDates.size;
  
  document.getElementById('metaInfo').innerHTML = `
    تم قراءة <strong>${totalRecords}</strong> سجل<br>
    عدد الموظفين: <strong>${totalEmployees}</strong><br>
    عدد الأيام: <strong>${totalDays}</strong> يوم
  `;

  renderAllData();
}

/* عرض جميع البيانات */
function renderAllData(){
  const reports = document.getElementById('reports');
  reports.innerHTML = '';
  const ids = Object.keys(state.grouped).sort((a,b)=>Number(a)-Number(b));
  
  if(ids.length === 0){
    reports.innerHTML = '<div class="empty">لا توجد سجلات للعرض.</div>';
    return;
  }

  const allDates = Array.from(state.allDates);
  
  ids.forEach(id => {
    const card = document.createElement('div');
    card.className = 'card';
    const name = state.names[id] || `الموظف ${id}`;
    const header = document.createElement('div');
    header.innerHTML = `<h3 style="margin:0 0 6px">${escapeHtml(name)}</h3><div class="small">الرقم: ${escapeHtml(id)} — ${allDates.length} يوم</div>`;
    card.appendChild(header);

    const wrap = document.createElement('div'); wrap.className = 'table-wrap';
    const table = document.createElement('table');
    const thead = document.createElement('thead');
    thead.innerHTML = `<tr><th>م</th><th>التاريخ</th><th>اليوم</th><th>الحضور 1</th><th>الحضور 2</th><th>انصراف 1</th><th>انصراف 2</th><th>انصراف 3</th></tr>`;
    table.appendChild(thead);

/* تنزيل CSV */
function downloadDisplayedCSV(){
  const ids = Object.keys(state.grouped).sort((a,b)=>Number(a)-Number(b));
  const allDates = Array.from(state.allDates);
  
  if(ids.length === 0) return alert('لا توجد بيانات للتحميل');
  
  const rows = [['ID','Name','Date','Day','Time1','Time2','Time3','Time4','Time5']];
  ids.forEach(id => {
    const name = state.names[id] || '';
    allDates.forEach(date => {
      const formattedDate = formatDateDMY(date);
      const times = state.grouped[id][date] || [];
      rows.push([id, name, formattedDate, getArabicWeekday(date), times[0]||'', times[1]||'', times[2]||'', times[3]||'', times[4]||'']);
    });
  });
  
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); 
  a.href = url; 
  a.download = `attendance_data_${new Date().toISOString().slice(0,10)}.csv`; 
  document.body.appendChild(a); 
  a.click(); 
  a.remove(); 
  URL.revokeObjectURL(url);
}

/* تنسيقات مساعدة */
function escapeHtml(s){ 
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
